<!--
  Simulador de retiro — embed para elproyectok.com/recursos/

  Pega este bloque entero en un bloque HTML personalizado de WordPress
  (NO en el editor visual — usa "Bloque HTML personalizado" o el clásico
  con la pestaña "Texto" / "Código"). El iframe se auto-redimensiona en
  altura escuchando un postMessage que envía el widget, así que nunca
  verás barras de scroll internas.

  IMPORTANTE:
  - El origen del iframe es backtesting-k.vercel.app — está configurado
    en next.config.mjs para aceptar embed desde elproyectok.com vía
    Content-Security-Policy frame-ancestors.
  - Si en algún momento mueves el widget a un subdominio propio
    (ej. simulador.elproyectok.com), basta con cambiar la `src` del
    iframe; los listeners ya funcionan en cualquier origen.
-->

<div id="epk-simulador-retiro-container" style="width:100%;margin:0 auto;max-width:1200px;">
  <iframe
    id="epk-simulador-retiro"
    src="https://backtesting-k.vercel.app/simulador-retiro"
    title="Simulador de retiro — El Proyecto K"
    width="100%"
    height="900"
    frameborder="0"
    style="border:0;display:block;width:100%;min-height:900px;background:#f5f0e8;"
    loading="lazy"
    referrerpolicy="origin-when-cross-origin"
    allow="clipboard-write"
  ></iframe>
</div>

<script>
  (function () {
    // Auto-redimensionar la altura del iframe escuchando el postMessage
    // que envía el widget cada vez que cambia su contenido.
    var iframe = document.getElementById("epk-simulador-retiro");
    if (!iframe) return;

    window.addEventListener("message", function (event) {
      // Aceptamos solo mensajes del origen del widget
      if (event.origin !== "https://backtesting-k.vercel.app") return;
      var data = event.data;
      if (!data || data.type !== "epk-iframe-height") return;
      var h = parseInt(data.height, 10);
      if (isFinite(h) && h > 200) {
        // +20px de colchón para evitar scroll interno por rounding
        iframe.style.height = h + 20 + "px";
      }
    });

    // Fallback: si por lo que sea el postMessage no llega (bloqueado,
    // navegador antiguo), aseguramos una altura mínima decente en móvil.
    setTimeout(function () {
      if (iframe.offsetHeight < 500) {
        iframe.style.height = "1200px";
      }
    }, 3000);
  })();
</script>
